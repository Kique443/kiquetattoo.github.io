<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kique Tattoo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080808;
    --surface: #111111;
    --surface2: #181818;
    --border: #222222;
    --accent: #f0b429;
    --accent2: #f0b429;
    --text: #f5f0e8;
    --muted: #666060;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding-bottom: 60px;
  }
  .app { width: 100%; max-width: 420px; position: relative; }

  /* HEADER */
  .header {
    padding: 44px 24px 24px;
    text-align: center;
    position: relative;
    background: linear-gradient(180deg, #0d0800 0%, var(--bg) 100%);
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -40px; left: 50%;
    transform: translateX(-50%);
    width: 320px; height: 200px;
    background: radial-gradient(ellipse, #f0b42918 0%, transparent 70%);
    pointer-events: none;
  }
  .logo-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 16px;
    cursor: pointer;
    user-select: none;
  }
  .logo-ring {
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 28px #f0b42930, 0 0 0 4px #f0b42910;
    transition: box-shadow 0.3s;
    background: #000;
  }
  .logo-ring:hover { box-shadow: 0 0 44px #f0b42960, 0 0 0 6px #f0b42920; }
  .logo-ring img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .studio-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 40px;
    letter-spacing: 6px;
    color: var(--text);
    line-height: 1;
    margin-bottom: 6px;
  }
  .studio-tagline {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* DIVIDER */
  .divider {
    display: flex; align-items: center; gap: 12px;
    padding: 0 24px; margin-bottom: 4px;
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-diamond {
    width: 6px; height: 6px;
    background: var(--accent);
    transform: rotate(45deg);
  }

  /* TABS */
  .tabs { display: flex; gap: 8px; padding: 14px 24px; }
  .tab {
    flex: 1; padding: 11px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-weight: 600; font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .tab.active {
    background: #1a1200;
    border-color: var(--accent);
    color: var(--accent);
  }

  /* SECTION */
  .section { padding: 6px 24px; }

  /* LINK BUTTONS */
  .link-btn {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; border-radius: 12px;
    margin-bottom: 9px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .link-btn:hover { border-color: #f0b42944; transform: translateY(-1px); background: #141200; }
  .link-icon-wrap {
    width: 38px; height: 38px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .link-text { font-weight: 600; font-size: 14px; flex: 1; }
  .link-arrow { color: #333; font-size: 18px; }

  /* PROMO CARD */
  .promo-card {
    margin-top: 4px; margin-bottom: 4px;
    padding: 20px;
    border-radius: 14px;
    background: linear-gradient(135deg, #140d00 0%, #0e0800 100%);
    border: 1px solid #f0b42922;
    text-align: center;
  }
  .promo-card h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; letter-spacing: 2px;
    color: var(--accent); margin-bottom: 6px;
  }
  .promo-card p { color: var(--muted); font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
  .btn-primary {
    display: inline-block; padding: 12px 28px; border-radius: 30px;
    background: linear-gradient(135deg, #c88a00, #f0b429);
    border: none; color: #000;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700; font-size: 14px;
    cursor: pointer; letter-spacing: 0.5px;
    box-shadow: 0 4px 16px #f0b42930;
    transition: all 0.2s; text-decoration: none;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px #f0b42960; }
  .btn-secondary {
    display: block; width: 100%; padding: 13px;
    border-radius: 10px; background: transparent;
    border: 1px solid var(--border);
    color: var(--muted); font-family: 'DM Sans', sans-serif;
    font-size: 13px; cursor: pointer;
    transition: all 0.2s; margin-top: 8px;
  }
  .btn-secondary:hover { border-color: #444; color: #888; }

  /* RULETA */
  .ruleta-wrap { padding: 0 24px; text-align: center; }
  .ruleta-hint { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 20px; }
  .wheel-container {
    position: relative; display: inline-block; margin-bottom: 18px;
  }
  .wheel-pointer {
    position: absolute; top: -14px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 24px solid var(--accent);
    filter: drop-shadow(0 0 8px var(--accent));
    z-index: 5;
  }
  canvas {
    display: block; border-radius: 50%;
    filter: drop-shadow(0 0 20px #f0b42920);
  }
  .spin-btn {
    display: block; width: 100%;
    padding: 18px; border-radius: 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; letter-spacing: 4px;
    border: none; cursor: pointer; transition: all 0.3s;
  }
  .spin-btn.active {
    background: linear-gradient(135deg, #c88a00 0%, #f0b429 100%);
    color: #000;
    box-shadow: 0 4px 24px #f0b42940;
  }
  .spin-btn.active:hover { transform: translateY(-2px); box-shadow: 0 8px 30px #f0b42960; }
  .spin-btn.disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; }
  .prizes-legend {
    margin-top: 20px; margin-bottom: 8px;
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  }
  .prize-chip {
    padding: 5px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
    border: 1px solid; letter-spacing: 0.5px;
  }

  /* MODAL */
  .modal { display: none; position: fixed; inset: 0; background: #00000080; z-index: 100; }
  .modal.show { display: flex; align-items: center; justify-content: center; }
  .modal-content {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 32px 24px; width: 90%; max-width: 380px;
    text-align: center; box-shadow: 0 8px 48px #0000006c;
    position: relative;
  }
  .modal-logo {
    width: 68px; height: 68px; border-radius: 50%;
    border: 2px solid var(--accent); margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    background: #0a0500;
  }
  .modal-logo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .modal h2 { font-family: 'Bebas Neue'; font-size: 28px; letter-spacing: 2px; margin-bottom: 4px; }
  .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
  .modal-msg { font-size: 14px; color: var(--text); line-height: 1.6; margin: 16px 0; }
  .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
  .modal-btns a, .modal-btns button {
    flex: 1; padding: 12px; border-radius: 10px;
    font-family: 'DM Sans'; font-size: 13px; font-weight: 600;
    border: 1px solid var(--border); cursor: pointer;
    transition: all 0.2s; text-decoration: none; display: block;
  }
  .modal-btns a {
    background: linear-gradient(135deg, #c88a00, #f0b429);
    border: none; color: #000;
  }
  .modal-btns button {
    background: transparent; color: var(--muted);
  }
  .modal-btns button:hover { border-color: #444; }

  /* TAP RING ANIMATION */
  @keyframes tapPulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.3); opacity: 0; }
  }
  .tap-ring.pulsing::before {
    animation: tapPulse 0.6s ease-out;
  }
  .tap-ring::before {
    content: ''; position: absolute; inset: 0;
    border-radius: 50%; border: 2px solid var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1a1000; border: 1px solid #f0b42955;
    color: var(--accent); padding: 12px 20px;
    border-radius: 8px; font-size: 12px;
    transition: transform 0.3s; pointer-events: none;
    z-index: 999;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <!-- HEADER -->
  <div class="header">
    <div class="logo-wrap" id="logoWrap">
      <div class="tap-ring" id="tapRing"></div>
      <div class="logo-ring"><img id="logoImg" src="" alt="logo"></div>
    </div>
    <h1 class="studio-name">KIQUE</h1>
    <div class="studio-tagline">TATTOO</div>
  </div>

  <!-- DIVIDER -->
  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-diamond"></div>
    <div class="divider-line"></div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('links')">LINKS</button>
    <button class="tab" onclick="switchTab('ruleta')">RULETA</button>
  </div>

  <!-- LINKS TAB -->
  <div id="tabLinks">
    <div class="section" id="linksContainer"></div>
  </div>

  <!-- RULETA TAB -->
  <div id="tabRuleta" style="display:none;">
    <div class="ruleta-wrap">
      <p class="ruleta-hint" id="ruletaHint">Una sola oportunidad por persona.<br>¡Girá y ganá un premio exclusivo!</p>

      <!-- WHEEL -->
      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <canvas id="wheel" width="280" height="280"></canvas>
      </div>

      <!-- BUTTON -->
      <button id="spinBtn" class="spin-btn active" onclick="girar()">✦ GIRAR ✦</button>

      <!-- LEGEND -->
      <div class="prizes-legend" id="prizesLegend"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="this.classList.contains('show') && closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-logo"><img id="modalLogoImg" src="" alt="logo"></div>
    <h2 id="modalTitle" style="color:#f0b429">20% OFF</h2>
    <p class="modal-sub" id="modalSub">Descripción del premio</p>
    <p class="modal-msg" id="modalMsg">Mensaje detallado del premio</p>
    <div class="modal-btns">
      <a id="modalWA" href="#" target="_blank">✓ Canjear por WhatsApp</a>
      <button onclick="closeModal()">Cerrar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

const linksContainer = document.getElementById('linksContainer');
CONFIG.links.forEach(l => {
  linksContainer.innerHTML += `
    <a href="${l.url}" target="_blank" rel="noreferrer" class="link-btn">
      <div class="link-icon-wrap" style="background:${l.color}18;border:1px solid ${l.color}44">${l.emoji}</div>
      <span class="link-text">${l.texto}</span>
      <span class="link-arrow">›</span>
    </a>`;
});

// — Build prize chips —
const legend = document.getElementById('prizesLegend');
CONFIG.premios.forEach(p => {
  legend.innerHTML += `<div class="prize-chip" style="color:${p.color};border-color:${p.color}55;background:${p.bg}">${p.titulo}</div>`;
});

// — Tabs —
function switchTab(tab) {
  document.getElementById('tabLinks').style.display = tab === 'links' ? 'block' : 'none';
  document.getElementById('tabRuleta').style.display = tab === 'ruleta' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'links') || (i === 1 && tab === 'ruleta'));
  });
  if (tab === 'ruleta') drawWheel(rotation);
}

// — Wheel —
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const n = CONFIG.premios.length;
const arc = (2 * Math.PI) / n;
let rotation = 0, spinning = false;
let alreadySpun = !!localStorage.getItem('kique_ruleta_v1');
if (alreadySpun) updateSpinState(true);

function drawWheel(rot) {
  const cx = canvas.width / 2, cy = canvas.height / 2, r = cx - 6;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  CONFIG.premios.forEach((p, i) => {
    const start = rot + i * arc, end = start + arc;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end); ctx.closePath();
    ctx.fillStyle = p.bg; ctx.fill();
    ctx.strokeStyle = p.color + '55'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(start + arc / 2);
    ctx.beginPath(); ctx.arc(r - 10, 0, 4, 0, Math.PI * 2);
    ctx.fillStyle = p.color; ctx.fill();
    ctx.textAlign = 'right'; ctx.fillStyle = '#f0ece4';
    ctx.font = 'bold 12px "DM Sans", sans-serif';
    ctx.fillText(p.titulo, r - 20, -4);
    ctx.fillStyle = '#777'; ctx.font = '10px "DM Sans", sans-serif';
    ctx.fillText(p.sub.split('(')[0].trim(), r - 20, 11);
    ctx.restore();
  });
  // Outer ring
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI);
  ctx.strokeStyle = '#f0b42966'; ctx.lineWidth = 3; ctx.stroke();
  // Ticks
  for (let i = 0; i < n; i++) {
    const a = rot + i * arc;
    ctx.beginPath();
    ctx.moveTo(cx + (r - 4) * Math.cos(a), cy + (r - 4) * Math.sin(a));
    ctx.lineTo(cx + (r + 2) * Math.cos(a), cy + (r + 2) * Math.sin(a));
    ctx.strokeStyle = '#f0b429'; ctx.lineWidth = 2; ctx.stroke();
  }
  // Center
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 32);
  grad.addColorStop(0, '#2a1a00'); grad.addColorStop(1, '#0a0800');
  ctx.beginPath(); ctx.arc(cx, cy, 32, 0, 2 * Math.PI);
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = '#f0b42988'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#f0b429';
  ctx.font = "bold 10px 'Bebas Neue', sans-serif";
  ctx.textAlign = 'center'; ctx.fillText('KIQUE', cx, cy + 4);
}
drawWheel(0);

function girar() {
  if (spinning || alreadySpun) return;
  spinning = true;
  const btn = document.getElementById('spinBtn');
  btn.textContent = '✦ Girando... ✦';
  btn.classList.remove('active'); btn.classList.add('disabled');
  const extra = 7 * 2 * Math.PI + Math.random() * 2 * Math.PI;
  const duration = 5500, start = performance.now(), startRot = rotation;
  function tick(now) {
    const elapsed = now - start, t = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - t, 4);
    rotation = startRot + extra * ease;
    drawWheel(rotation);
    if (t < 1) { requestAnimationFrame(tick); return; }
    const ptr = -Math.PI / 2;
    const norm = ((ptr - rotation) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
    const idx = Math.floor(norm / arc) % n;
    spinning = false; alreadySpun = true;
    localStorage.setItem('kique_ruleta_v1', '1');
    updateSpinState(true);
    showPrize(idx);
  }
  requestAnimationFrame(tick);
}

function updateSpinState(done) {
  const btn = document.getElementById('spinBtn');
  if (done) {
    btn.textContent = 'Ya participaste 🖤';
    btn.classList.remove('active'); btn.classList.add('disabled');
    document.getElementById('ruletaHint').textContent = 'Ya usaste tu giro. ¡Esperamos verte pronto!';
  }
}

function showPrize(idx) {
  const p = CONFIG.premios[idx];
  document.getElementById('modalTitle').textContent = p.titulo;
  document.getElementById('modalTitle').style.color = p.color;
  document.getElementById('modalSub').textContent = p.sub;
  document.getElementById('modalMsg').textContent = p.msg;
  const txt = encodeURIComponent('¡Hola Kique! Giré la ruleta y gané: ' + p.titulo + ' — ' + p.sub + '. Te mando la captura para canjear el premio 🎉');
  document.getElementById('modalWA').href = 'https://wa.me/' + CONFIG.wa + '?text=' + txt;
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

// — Secret reset: 20 taps on logo —
let tapCount = 0, tapTimer;
document.getElementById('logoWrap').addEventListener('click', () => {
  tapCount++;
  const ring = document.getElementById('tapRing');
  ring.classList.remove('pulsing');
  void ring.offsetWidth;
  ring.classList.add('pulsing');
  clearTimeout(tapTimer);
  if (tapCount >= 20) {
    localStorage.removeItem('kique_ruleta_v1');
    alreadySpun = false; spinning = false;
    const btn = document.getElementById('spinBtn');
    btn.textContent = '✦ GIRAR ✦';
    btn.classList.add('active'); btn.classList.remove('disabled');
    document.getElementById('ruletaHint').innerHTML = 'Una sola oportunidad por persona.<br>¡Girá y ganá un premio exclusivo!';
    tapCount = 0;
    showToast('✅ Ruleta reseteada');
    return;
  }
  if (tapCount >= 10) showToast('🔓 ' + (20 - tapCount) + ' toques más para resetear');
  tapTimer = setTimeout(() => tapCount = 0, 3000);
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
